version: "3.11"

services:
  # -- Telegram Bot (long polling) ------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data        # Persist SQLite DB
    env_file: .env
    restart: unless-stopped
    networks:
      - internal

  # -- FastAPI (health, future dashboard) -----------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"             # Accessible via Tailscale IP:8000
    volumes:
      - ./data:/app/data        # Shared SQLite volume
    env_file: .env
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
