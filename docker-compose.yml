services:
  # -- Telegram Bot (long polling) ------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data        # Persist SQLite DB
      - ./data/chroma:/app/chroma_db  # Persist ChromaDB Vector Storage
      - ./core:/app/core
      - ./bot:/app/bot
      - ./db:/app/db
      - ./config.py:/app/config.py
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # -- FastAPI (Desktop Adapter & Voice Stream) -----------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"             # Accessible via Tailscale IP:8000
    volumes:
      - ./data:/app/data        # Shared SQLite volume
      - ./data/chroma:/app/chroma_db  # Shared ChromaDB Vector Storage with Bot
      - ./core:/app/core
      - ./api:/app/api
      - ./db:/app/db
      - ./config.py:/app/config.py
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # -- Neo4j Graph Database (for GraphRAG) ----------------------------------
  neo4j:
    image: neo4j:5.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # HTTP Browser
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - internal

networks:
  internal:
    driver: bridge
