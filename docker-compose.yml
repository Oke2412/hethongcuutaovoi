version: "3.8"

services:
  # -- Telegram Bot (long polling) ------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data        # Persist SQLite DB
      - ./data/chroma:/app/chroma_db  # Persist ChromaDB Vector Storage
    env_file: .env
    restart: unless-stopped
    networks:
      - internal

  # -- FastAPI (health, future dashboard) -----------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"             # Accessible via Tailscale IP:8000
    volumes:
      - ./data:/app/data        # Shared SQLite volume
    env_file: .env
    restart: unless-stopped
    networks:
      - internal

  # -- Neo4j Graph Database (for GraphRAG) ----------------------------------
  neo4j:
    image: neo4j:5.12
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    networks:
      - internal

networks:
  internal:
    driver: bridge
